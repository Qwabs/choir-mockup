<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('../assets/fonts/fraunces-var.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Fraunces';
    src: url('../assets/fonts/fraunces-italic-var.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: 'Archivo';
    src: url('../assets/fonts/archivo-var.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 2400px; height: 1900px; overflow: hidden; }
  body {
    font-family: 'Archivo', sans-serif;
    color: #241b14;
    background: #f3ede1;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 2400px;
    height: 1900px;
    padding: 68px 80px 40px;
    display: flex;
    flex-direction: column;
  }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(36, 27, 20, .18); pointer-events: none; }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 40px;
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(36, 27, 20, .18);
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 130px; height: auto; }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .11em;
    line-height: 1;
    text-transform: uppercase;
    font-variation-settings: 'opsz' 60, 'wght' 600;
  }
  .brand-sub {
    margin-top: 9px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .3em;
    line-height: 1;
    text-transform: uppercase;
    color: #8a5d22;
  }
  .head-copy { text-align: right; }
  .head-copy .eyebrow {
    margin: 0 0 12px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #8a5d22;
  }
  .head-copy h1 {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-size: 66px;
    font-weight: 600;
    line-height: .92;
    letter-spacing: -.035em;
    font-variation-settings: 'opsz' 144, 'wght' 600;
  }
  .head-copy h1 em { font-weight: 400; font-style: italic; }
  .head-copy p {
    margin: 16px 0 0 auto;
    max-width: 600px;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(36, 27, 20, .66);
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 18px;
    padding-top: 24px;
  }
  .card {
    --c: #ac5129;
    --inkdot: #e0ae58;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 16px 18px 12px;
    border: 1px solid rgba(36, 27, 20, .13);
    border-radius: 2px;
    background: color-mix(in srgb, var(--c) 6.5%, #f7f1e5);
  }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .layout {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #8a5d22;
  }
  .color {
    font-family: 'Fraunces', serif;
    font-size: 31px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -.02em;
    font-variation-settings: 'opsz' 40, 'wght' 500;
  }
  .num { font-size: 9px; letter-spacing: .2em; color: rgba(36, 27, 20, .42); }
  .ink {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .17em;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .56);
  }
  .ink i { width: 7px; height: 7px; border: 1px solid rgba(36, 27, 20, .18); border-radius: 50%; background: var(--inkdot); }
  .image { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 2px 0 0; }
  .image img { display: block; width: min(100%, 390px); height: auto; filter: drop-shadow(0 18px 16px rgba(47, 27, 10, .24)); }
  .cap {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding-top: 8px;
    border-top: 1px solid rgba(36, 27, 20, .1);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .17em;
    line-height: 1.3;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .5);
  }
  .cap b { color: #8a5d22; font-weight: 600; }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    padding-top: 18px;
    margin-top: 4px;
    border-top: 1px solid rgba(36, 27, 20, .18);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .2em;
    line-height: 1.5;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .48);
  }
  footer b { color: #241b14; font-weight: 600; }
  .swatches { display: flex; align-items: center; gap: 10px; }
  .swatches i { display: block; width: 16px; height: 16px; border: 1px solid rgba(36, 27, 20, .2); border-radius: 50%; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>
  <header>
    <div class="brand">
      <img src="../assets/img/mark.svg" alt="">
      <div>
        <div class="brand-name">Meto Dwom</div>
        <div class="brand-sub">2nd Edition · Back studies</div>
      </div>
    </div>
    <div class="head-copy">
      <p class="eyebrow">Back studies — 002</p>
      <h1>Two ways to <em>sign it.</em></h1>
      <p>The supplied treble clef above or below the METO DWOM wordmark. Six back studies across White, Green and Blue — no edition line.</p>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="swatches">
      <i style="background:#F1EADF"></i><i style="background:#3B4A39"></i><i style="background:#2A3650"></i>
    </div>
    <div><b>Meto Dwom 2nd Edition</b> · back studies · 8.6 × 4.0 in · 300 DPI artwork</div>
  </footer>
</div>
<script>
  var COLORS = [
    { id: 'white', name: 'White', ink: 'Espresso', inkHex: '#2A2119', hex: '#F1EADF' },
    { id: 'green', name: 'Green', ink: 'Warm ecru', inkHex: '#F1E5CD', hex: '#3B4A39' },
    { id: 'blue', name: 'Blue', ink: 'Antique gold', inkHex: '#E0AE58', hex: '#2A3650' }
  ];
  var LAYOUTS = [
    { id: 'above', name: 'Note above', code: 'A' },
    { id: 'below', name: 'Note below', code: 'B' }
  ];
  var grid = document.getElementById('grid');
  var n = 0;
  LAYOUTS.forEach(function (layout) {
    COLORS.forEach(function (c) {
      n += 1;
      var card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--c', c.hex);
      card.style.setProperty('--inkdot', c.inkHex);
      card.innerHTML =
        '<div class="card-top"><span class="layout">' + layout.name + '</span><span class="color">' + c.name + '</span><span class="num">0' + n + '</span></div>' +
        '<div class="ink"><i></i>' + c.ink + '</div>' +
        '<div class="image"><img src="../assets/img/tees/' + c.id + '-back-' + layout.id + '.webp" alt=""></div>' +
        '<div class="cap"><span>Back study <b>' + layout.code + '</b></span><span>8.6 × 4.0 in · ' + c.name.toLowerCase() + '</span></div>';
      grid.appendChild(card);
    });
  });
</script>
</body>
</html>
