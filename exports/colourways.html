<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('../assets/fonts/fraunces-var.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Fraunces';
    src: url('../assets/fonts/fraunces-italic-var.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: 'Archivo';
    src: url('../assets/fonts/archivo-var.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 2400px; height: 900px; overflow: hidden; }
  body {
    font-family: 'Archivo', sans-serif;
    background: #f3ede1;
    color: #241b14;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    position: relative;
    width: 2400px;
    height: 900px;
    padding: 78px 80px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(36, 27, 20, .18);
    pointer-events: none;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 40px;
    padding-bottom: 36px;
    border-bottom: 1px solid rgba(36, 27, 20, .18);
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 130px; height: auto; }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .11em;
    line-height: 1;
    text-transform: uppercase;
    font-variation-settings: 'opsz' 60, 'wght' 600;
  }
  .brand-sub {
    margin-top: 9px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .3em;
    line-height: 1;
    text-transform: uppercase;
    color: #8a5d22;
  }
  .head-copy { text-align: right; }
  .head-copy .eyebrow {
    margin: 0 0 12px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #8a5d22;
  }
  .head-copy h1 {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-size: 64px;
    font-weight: 600;
    line-height: .92;
    letter-spacing: -.035em;
    font-variation-settings: 'opsz' 144, 'wght' 600;
  }
  .head-copy h1 em { font-weight: 400; font-style: italic; }
  .head-copy p {
    margin: 18px 0 0 auto;
    max-width: 520px;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(36, 27, 20, .66);
  }
  .grid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: auto;
    gap: 20px;
    padding-top: 28px;
  }
  .card {
    --c: #ac5129;
    --inkdot: #e0ae58;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 20px 22px 14px;
    border: 1px solid rgba(36, 27, 20, .13);
    border-radius: 2px;
    background: #f6f0e4;
    background: color-mix(in srgb, var(--c) 6.5%, #f7f1e5);
  }
  .card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .card-name {
    font-family: 'Fraunces', serif;
    font-size: 39px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -.025em;
    font-variation-settings: 'opsz' 60, 'wght' 500;
  }
  .card-num {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .2em;
    color: rgba(36, 27, 20, .42);
  }
  .card-ink {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .18em;
    line-height: 1;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .56);
  }
  .card-ink i {
    width: 7px;
    height: 7px;
    border: 1px solid rgba(36, 27, 20, .18);
    border-radius: 50%;
    background: var(--inkdot);
  }
  .pair {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    min-height: 0;
    padding: 4px 0 0;
  }
  .pair figure {
    margin: 0;
    width: 44%;
    max-width: 340px;
    min-width: 0;
    text-align: center;
  }
  .pair img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 18px 16px rgba(47, 27, 10, .24));
  }
  .pair figcaption {
    margin-top: 8px;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .22em;
    line-height: 1;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .48);
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    padding-top: 22px;
    margin-top: 4px;
    border-top: 1px solid rgba(36, 27, 20, .18);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .2em;
    line-height: 1.5;
    text-transform: uppercase;
    color: rgba(36, 27, 20, .48);
  }
  footer b { color: #241b14; font-weight: 600; }
  .swatches { display: flex; align-items: center; gap: 10px; }
  .swatches i {
    display: block;
    width: 16px;
    height: 16px;
    border: 1px solid rgba(36, 27, 20, .2);
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>

  <header>
    <div class="brand">
      <img src="../assets/img/mark.svg" alt="">
      <div>
        <div class="brand-name">Meto Dwom</div>
        <div class="brand-sub">2nd Edition</div>
      </div>
    </div>
    <div class="head-copy">
      <p class="eyebrow">Apparel study — 002</p>
      <h1>Three ways to <em>sing it.</em></h1>
      <p>Espresso on white, warm ecru on green, antique gold on blue. Front mark and back wordmark on every colourway.</p>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="swatches">
      <i style="background:#F1EADF"></i><i style="background:#3B4A39"></i><i style="background:#2A3650"></i>
    </div>
    <div><b>Meto Dwom 2nd Edition</b> · mockup preview — not to scale · print artwork supplied at 300 DPI</div>
  </footer>
</div>

<script>
  var COLOURS = [
    { id: 'white', name: 'White', ink: 'Espresso', inkHex: '#2A2119', hex: '#F1EADF' },
    { id: 'green', name: 'Green', ink: 'Warm ecru', inkHex: '#F1E5CD', hex: '#3B4A39' },
    { id: 'blue',  name: 'Blue',  ink: 'Antique gold', inkHex: '#E0AE58', hex: '#2A3650' }
  ];
  var grid = document.getElementById('grid');
  COLOURS.forEach(function (c, i) {
    var n = i < 9 ? '0' + (i + 1) : String(i + 1);
    var card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--c', c.hex);
    card.style.setProperty('--inkdot', c.inkHex);
    card.innerHTML =
      '<div class="card-top"><div class="card-name">' + c.name + '</div><div class="card-num">' + n + '</div></div>' +
      '<div class="card-ink"><i></i>' + c.ink + '</div>' +
      '<div class="pair">' +
        '<figure><img src="../assets/img/tees/' + c.id + '-front.webp" alt=""><figcaption>Front · Left chest</figcaption></figure>' +
        '<figure><img src="../assets/img/tees/' + c.id + '-back.webp" alt=""><figcaption>Back · Wordmark</figcaption></figure>' +
      '</div>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
